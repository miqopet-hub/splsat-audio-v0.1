<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Splat Audio v0.1</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; color:#eee; font-family:Arial, Helvetica, sans-serif; }
    #stage { position:fixed; inset:0; }
    canvas { display:block; }
    #enter {
      position:fixed; inset:0; z-index:10; display:grid; place-items:center;
      background:rgba(0,0,0,.58); border:0; color:#fff; cursor:pointer;
      font:600 14px/1.45 Arial, Helvetica, sans-serif; letter-spacing:.04em;
    }
    #enter span { text-align:center; padding:22px; }
    #enter small { display:block; margin-top:8px; opacity:.65; font-weight:400; letter-spacing:0; }
    #status {
      position:fixed; left:14px; bottom:12px; z-index:4; pointer-events:none;
      font:11px/1.35 monospace; color:rgba(255,255,255,.55); white-space:pre;
    }
    #crosshair { position:fixed; left:50%; top:50%; width:5px; height:5px; border:1px solid rgba(255,255,255,.35); border-radius:50%; transform:translate(-50%,-50%); z-index:3; pointer-events:none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="crosshair"></div>
  <button id="enter" type="button"><span>CLICK TO ENTER<small>WASD move · mouse look · Q/E down/up · Shift faster · Esc releases mouse</small></span></button>
  <div id="status">loading splat…</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
