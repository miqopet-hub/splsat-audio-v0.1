<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Splat Audio Playground</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif}
    #stage{position:fixed;inset:0;z-index:0}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
    canvas.dragging{cursor:grabbing}
    #toolbar{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:auto}
    #sceneSelect,#resetView{height:40px;border:1px solid rgba(255,255,255,.20);background:rgba(10,10,10,.78);color:#fff;border-radius:10px;padding:0 12px;backdrop-filter:blur(10px);font:12px Arial,sans-serif}
    #sceneSelect{max-width:min(70vw,330px)}
    #resetView{white-space:nowrap}
    #enter{position:fixed;inset:0;z-index:40;display:grid;place-items:center;border:0;background:rgba(0,0,0,.58);color:#fff;font:600 14px/1.45 Arial,sans-serif;letter-spacing:.04em}
    #enter span{text-align:center;padding:24px}
    #enter small{display:block;margin-top:10px;opacity:.68;font-weight:400;letter-spacing:0;max-width:420px}
    #status{position:fixed;z-index:20;left:12px;bottom:max(10px,env(safe-area-inset-bottom));max-width:82vw;pointer-events:none;font:10px/1.35 monospace;color:rgba(255,255,255,.52);white-space:pre-wrap;text-shadow:0 1px 3px #000}
    #crosshair{position:fixed;z-index:15;left:50%;top:50%;width:5px;height:5px;border:1px solid rgba(255,255,255,.3);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
    #mobileControls{display:none;position:fixed;inset:0;z-index:18;pointer-events:none}
    #movePad{position:absolute;left:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));width:132px;height:132px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.035);pointer-events:auto;touch-action:none}
    #moveKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);pointer-events:none}
    #lookPad{position:absolute;right:0;top:62px;bottom:0;width:58%;pointer-events:auto;touch-action:none}
    #mobileHint{position:absolute;right:16px;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));font:10px/1.3 Arial,sans-serif;color:rgba(255,255,255,.45);text-align:right;pointer-events:none;text-shadow:0 1px 3px #000}
    @media (pointer:coarse),(max-width:800px){#mobileControls{display:block}#status{bottom:168px;max-width:56vw}#sceneSelect,#resetView{height:42px;font-size:13px}#enter small.desktop{display:none}canvas{cursor:default}}
    @media (pointer:fine) and (min-width:801px){#enter small.mobile{display:none}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="crosshair"></div>
  <div id="toolbar"><select id="sceneSelect" aria-label="Choose splat scene"></select><button id="resetView" type="button">Reset view</button></div>
  <button id="enter" type="button"><span>ENTER SPLAT AUDIO<small class="desktop">Drag to look · WASD walk · wheel moves forward/back · Q/E down/up · Shift faster</small><small class="mobile">Left thumb moves · drag right side to look</small></span></button>
  <div id="mobileControls"><div id="movePad"><div id="moveKnob"></div></div><div id="lookPad"></div><div id="mobileHint">left thumb: move<br>right side: look</div></div>
  <div id="status">loading scene…</div>
  <script>
    // If the ES-module graph fails before app.js can run, don't leave a silent black screen.
    window.addEventListener('error', function (event) {
      const status = document.getElementById('status');
      if (!status) return;
      const msg = event && event.message ? event.message : 'module failed to start';
      status.textContent = 'startup error: ' + msg;
      status.style.color = 'rgba(255,150,150,.95)';
    });
    window.addEventListener('unhandledrejection', function (event) {
      const status = document.getElementById('status');
      if (!status) return;
      const reason = event && event.reason;
      status.textContent = 'startup error: ' + (reason && reason.message ? reason.message : String(reason || 'unknown error'));
      status.style.color = 'rgba(255,150,150,.95)';
    });
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
